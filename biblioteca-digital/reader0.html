<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de PDF - Biblioteca Digital</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <style>
        :root {
            --reader-bg: #f8f9fa;
            --reader-sidebar-bg: #2c3e50;
            --reader-sidebar-text: #ecf0f1;
            --reader-toolbar-bg: #34495e;
            --reader-page-bg: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--reader-bg);
            height: 100vh;
            overflow: hidden;
        }

        .reader-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .reader-sidebar {
            width: 300px;
            background: var(--reader-sidebar-bg);
            color: var(--reader-sidebar-text);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .book-info h1 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }

        .book-info .author {
            color: #bdc3c7;
            font-size: 0.9rem;
        }

        .thumbnail-container {
            margin-top: 1rem;
        }

        .page-thumbnail {
            width: 100%;
            height: 120px;
            background: var(--reader-page-bg);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-bottom: 0.5rem;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }
        


      


        .page-thumbnail:hover {
            border-color: #3498db;
        }

        .page-thumbnail.active {
            border-color: #e74c3c;
        }

        .page-thumbnail canvas {
            max-width: 100%;
            max-height: 100%;
        }

        /* Main Content */
        .reader-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Toolbar */
        .reader-toolbar {
            background: var(--reader-toolbar-bg);
            color: white;
            padding: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .toolbar-left, .toolbar-center, .toolbar-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .toolbar-btn {
  background: none;
  border: none;
  color: white;
  padding: 0.5rem;
  border-radius: 4px;
  cursor: pointer;
  transition: background 0.2s ease;
}

.toolbar-btn:hover {
  background: rgba(255, 255, 255, 0.1);
}

    

.toolbar-btn-V {
  background: linear-gradient(90deg, #679583 0%, #b1ead2 100%);
  border: none;
  color: #fff;
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 1.15rem;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 2px 8px rgba(30, 60, 50, 0.12);
  cursor: pointer;
  transition: background 0.2s, color 0.18s, box-shadow 0.18s;
  text-decoration: none;
}

.toolbar-btn-V i {
  font-size: 1.25rem;
  margin-right: 6px;
}

.toolbar-btn-V:hover {
  background: linear-gradient(90deg, #1e4837 0%, #185a3e 100%);
  box-shadow: 0 4px 16px rgba(30, 60, 50, 0.22);
  color: #eadb9f;
}

.toolbar-btn-V:active {
  outline: none;
  filter: brightness(0.95);
}

.toolbar-btn-V a {
  color: inherit;
  text-decoration: none;
}

        .page-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .page-input {
            width: 60px;
            padding: 0.25rem;
            border: none;
            border-radius: 4px;
            text-align: center;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Content Area */
        .reader-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: auto;
            position: relative;
        }

        .pdf-container {
            background: var(--reader-page-bg);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            overflow: auto;
            max-width: 100%;
            max-height: 100%;
        }

        #pdf-canvas {
            display: block;
            margin: 0 auto;
        }

        .loading-spinner {
            text-align: center;
            padding: 3rem;
            color: #7f8c8d;
        }

        .loading-spinner i {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .reader-sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                transform: translateX(-100%);
            }

            .reader-sidebar.open {
                transform: translateX(0);
            }

            .sidebar-toggle {
                display: block !important;
            }
        }

        .sidebar-toggle {
            display: none;
        }

        /* Progress Bar */
        .reading-progress {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.2);
            position: absolute;
            top: 0;
            left: 0;
        }

        .progress-bar {
            height: 100%;
            background: #e74c3c;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="reader-container">
        <!-- Sidebar -->
        <div class="reader-sidebar" id="readerSidebar">
            <div class="sidebar-header">
                <div class="book-info">
                    <h1 id="bookTitle">Carregando...</h1>
                    <div class="author" id="bookAuthor"></div>
                </div>
                <div class="thumbnail-container" id="thumbnailContainer">
                    <!-- Miniaturas serão geradas aqui -->
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="reader-main">
            <!-- Toolbar -->
            <div class="reader-toolbar">
                <div class="toolbar-left">
                    <button class="toolbar-btn sidebar-toggle" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <button class="toolbar-btn-V" onclick="goBack()">
                        <a href="/biblioteca-digital/index.html"><i class="fas fa-arrow-left"></i> Voltar</a>
                    </button>
                </div>
                
                <div class="toolbar-center">
                    <div class="page-controls">
                        <button class="toolbar-btn" onclick="previousPage()">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <span>
                            Página <input type="number" id="currentPage" class="page-input" min="1" onchange="goToPage(this.value)"> 
                            de <span id="totalPages">0</span>
                        </span>
                        <button class="toolbar-btn" onclick="nextPage()">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <div class="toolbar-right">
                    <div class="zoom-controls">
                        <button class="toolbar-btn" onclick="zoomOut()">
                            <i class="fas fa-search-minus"></i>
                        </button>
                        <span id="zoomLevel">100%</span>
                        <button class="toolbar-btn" onclick="zoomIn()">
                            <i class="fas fa-search-plus"></i>
                        </button>
                    </div>
                    <button class="toolbar-btn" onclick="toggleFullscreen()">
                        <i class="fas fa-expand"></i>
                    </button>
                    <button class="toolbar-btn" onclick="downloadBook()">
                        <i class="fas fa-download"></i>
                    </button>
                    <button class="toolbar-btn" onclick="closeReader()">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="reading-progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <!-- Content Area -->
            <div class="reader-content">
                <div class="pdf-container">
                    <div class="loading-spinner" id="loadingSpinner">
                        <i class="fas fa-book-open"></i>
                        <p>Carregando livro...</p>
                    </div>
                    <canvas id="pdf-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Variáveis globais
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        let scale = 1.2;
        let canvas = document.getElementById('pdf-canvas');
        let ctx = canvas.getContext('2d');
        let currentBook = null;

        // Inicialização
        document.addEventListener('DOMContentLoaded', async () => {
            currentBook = JSON.parse(sessionStorage.getItem('currentBook'));
            
            if (!currentBook) {
                alert('Nenhum livro selecionado.');
                window.close();
                return;
            }

            document.getElementById('bookTitle').textContent = currentBook.title;
            document.getElementById('bookAuthor').textContent = `por ${currentBook.author}`;

            await loadPDF(currentBook.file);
            setupEventListeners();
            updateProgressBar();
        });

        // Carregar PDF
        async function loadPDF(url) {
            try {
                const loadingTask = pdfjsLib.getDocument(url);
                pdfDoc = await loadingTask.promise;
                
                totalPages = pdfDoc.numPages;
                document.getElementById('totalPages').textContent = totalPages;
                document.getElementById('currentPage').value = 1;
                
                // Esconder spinner
                document.getElementById('loadingSpinner').style.display = 'none';
                
                await renderPage(1);
                await generateThumbnails();
                
            } catch (error) {
                console.error('Erro ao carregar PDF:', error);
                document.getElementById('loadingSpinner').innerHTML = `
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>Erro ao carregar o livro.</p>
                    <button class="btn btn-primary" onclick="window.close()">Fechar</button>
                `;
            }
        }

        // Renderizar página
        async function renderPage(num) {
            try {
                const page = await pdfDoc.getPage(num);
                const viewport = page.getViewport({ scale: scale });
                
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                
                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                
                await page.render(renderContext).promise;
                currentPage = num;
                document.getElementById('currentPage').value = currentPage;
                updateProgressBar();
                
            } catch (error) {
                console.error('Erro ao renderizar página:', error);
            }
        }

        // Gerar miniaturas
        async function generateThumbnails() {
            const container = document.getElementById('thumbnailContainer');
            container.innerHTML = '';
            
            // Limita a 10 miniaturas para performance
            const maxThumbnails = Math.min(totalPages, 10);
            
            for (let i = 1; i <= maxThumbnails; i++) {
                const thumbnail = document.createElement('div');
                thumbnail.className = 'page-thumbnail';
                if (i === 1) thumbnail.classList.add('active');
                
                thumbnail.innerHTML = `<canvas id="thumb-${i}"></canvas>`;
                thumbnail.onclick = () => goToPage(i);
                
                container.appendChild(thumbnail);
                
                // Renderizar miniatura
                try {
                    const page = await pdfDoc.getPage(i);
                    const thumbViewport = page.getViewport({ scale: 0.2 });
                    const thumbCanvas = document.getElementById(`thumb-${i}`);
                    const thumbCtx = thumbCanvas.getContext('2d');
                    
                    thumbCanvas.height = thumbViewport.height;
                    thumbCanvas.width = thumbViewport.width;
                    
                    await page.render({
                        canvasContext: thumbCtx,
                        viewport: thumbViewport
                    }).promise;
                } catch (error) {
                    console.error('Erro ao gerar miniatura:', error);
                }
            }
        }

        // Navegação
        function previousPage() {
            if (currentPage <= 1) return;
            renderPage(currentPage - 1);
            updateThumbnails();
        }

        function nextPage() {
            if (currentPage >= totalPages) return;
            renderPage(currentPage + 1);
            updateThumbnails();
        }

        function goToPage(num) {
            const pageNum = parseInt(num);
            if (pageNum >= 1 && pageNum <= totalPages) {
                renderPage(pageNum);
                updateThumbnails();
            }
        }

        function updateThumbnails() {
            const thumbnails = document.querySelectorAll('.page-thumbnail');
            thumbnails.forEach((thumb, index) => {
                thumb.classList.toggle('active', index + 1 === currentPage);
            });
        }

        // Zoom
        function zoomIn() {
            if (scale >= 3) return;
            scale += 0.1;
            updateZoom();
            renderPage(currentPage);
        }

        function zoomOut() {
            if (scale <= 0.5) return;
            scale -= 0.1;
            updateZoom();
            renderPage(currentPage);
        }

        function updateZoom() {
            document.getElementById('zoomLevel').textContent = Math.round(scale * 100) + '%';
        }

        // Barra de progresso
        function updateProgressBar() {
            const progress = (currentPage / totalPages) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        // Controles de tela
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        function toggleSidebar() {
            document.getElementById('readerSidebar').classList.toggle('open');
        }

        // Download
        function downloadBook() {
            if (currentBook) {
                const link = document.createElement('a');
                link.href = currentBook.file;
                link.download = currentBook.title.replace(/\s+/g, '-').toLowerCase() + '.pdf';
                link.click();
            }
        }

        // Voltar
        function goBack() {
            window.close();
        }

        function closeReader() {
            window.close();
        }

        // Event listeners
        function setupEventListeners() {
            // Teclado
            document.addEventListener('keydown', (e) => {
                switch(e.key) {
                    case 'ArrowLeft':
                        previousPage();
                        break;
                    case 'ArrowRight':
                        nextPage();
                        break;
                    case 'Escape':
                        closeReader();
                        break;
                }
            });

            // Swipe para mobile
            let touchStartX = 0;
            canvas.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            });

            canvas.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX - touchEndX;

                if (Math.abs(diff) > 50) {
                    if (diff > 0) {
                        nextPage();
                    } else {
                        previousPage();
                    }
                }
            });
        }
    </script>
</body>
</html>
